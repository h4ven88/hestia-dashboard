name: Train Wake Word

on:
  workflow_dispatch:
    inputs:
      word:
        description: 'Wake word to train (e.g. Athena, Hestia, Jarvis)'
        required: true
        default: 'Athena'
      clips:
        description: 'Number of synthetic clips to generate'
        required: false
        default: '500'
  workflow_call:
    inputs:
      word:
        required: true
        type: string
      clips:
        required: false
        type: string
        default: '500'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1 sox

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install \
            edge-tts==6.1.12 \
            numpy==1.26.4 \
            scipy==1.13.0 \
            soundfile==0.12.1 \
            pydub==0.25.1 \
            onnx==1.16.0 \
            onnxruntime==1.18.0
          pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Download OpenWakeWord backbone models
        run: |
          mkdir -p $GITHUB_WORKSPACE/.oww_backbone
          wget -q -O $GITHUB_WORKSPACE/.oww_backbone/melspectrogram.onnx \
            "https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/melspectrogram.onnx"
          wget -q -O $GITHUB_WORKSPACE/.oww_backbone/embedding_model.onnx \
            "https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/embedding_model.onnx"
          ls -lh $GITHUB_WORKSPACE/.oww_backbone/

      - name: Download negative features dataset
        run: |
          mkdir -p $GITHUB_WORKSPACE/.oww_cache
          echo "Downloading negative features (~500MB)..."
          wget -q --show-progress \
            "https://huggingface.co/datasets/davidscripka/openwakeword_features/resolve/main/openwakeword_features_ACAV100M_2000_hrs_16bit.npy" \
            -O $GITHUB_WORKSPACE/.oww_cache/negative_features.npy
          echo "Downloaded: $(du -h $GITHUB_WORKSPACE/.oww_cache/negative_features.npy | cut -f1)"

      - name: Generate synthetic clips
        run: |
          WORD="${{ github.event.inputs.word || inputs.word }}"
          CLIPS="${{ github.event.inputs.clips || inputs.clips || '500' }}"
          WORD_LOWER=$(echo "$WORD" | tr '[:upper:]' '[:lower:]')
          mkdir -p $GITHUB_WORKSPACE/.oww_clips/${WORD_LOWER}

          python3 << PYTHON
import asyncio, os, sys, random
import edge_tts

WORD      = "${WORD}"
CLIPS     = int("${CLIPS}")
OUT       = "$GITHUB_WORKSPACE/.oww_clips/${WORD_LOWER}"

VOICES = [
    "en-US-AriaNeural",     "en-US-GuyNeural",
    "en-US-JennyNeural",    "en-US-EricNeural",
    "en-US-MichelleNeural", "en-US-ChristopherNeural",
    "en-US-MonicaNeural",   "en-US-BrandonNeural",
    "en-GB-SoniaNeural",    "en-GB-RyanNeural",
    "en-GB-LibbyNeural",    "en-GB-ThomasNeural",
    "en-AU-NatashaNeural",  "en-AU-WilliamNeural",
    "en-IN-NeerjaNeural",   "en-IN-PrabhatNeural",
    "en-CA-ClaraNeural",    "en-CA-LiamNeural",
]
SPEEDS = ["-25%", "-15%", "-5%", "+0%", "+10%", "+20%", "+30%"]

combos = [(v, s) for v in VOICES for s in SPEEDS]
random.seed(42)
random.shuffle(combos)
while len(combos) < CLIPS:
    combos += combos
combos = combos[:CLIPS]

async def gen(word, voice, speed, path):
    try:
        c = edge_tts.Communicate(word, voice, rate=speed)
        await c.save(path)
        return True
    except:
        return False

async def main():
    ok = 0
    for i in range(0, len(combos), 20):
        batch = combos[i:i+20]
        tasks = [gen(WORD, v, s, f"{OUT}/pos_{i+j:04d}.mp3")
                 for j,(v,s) in enumerate(batch)]
        results = await asyncio.gather(*tasks)
        ok += sum(results)
        done = min(i+20, len(combos))
        if done % 100 == 0 or done >= len(combos):
            print(f"  {done}/{len(combos)} clips ({ok} ok)")
        await asyncio.sleep(0.3)
    print(f"Done: {ok} clips")
    if ok < 50:
        sys.exit(1)

asyncio.run(main())
PYTHON
          echo "Clips: $(ls $GITHUB_WORKSPACE/.oww_clips/${WORD_LOWER}/ | wc -l)"

      - name: Convert clips to 16kHz WAV
        run: |
          WORD="${{ github.event.inputs.word || inputs.word }}"
          WORD_LOWER=$(echo "$WORD" | tr '[:upper:]' '[:lower:]')
          mkdir -p $GITHUB_WORKSPACE/.oww_wav/${WORD_LOWER}
          count=0
          for f in $GITHUB_WORKSPACE/.oww_clips/${WORD_LOWER}/*.mp3; do
            base=$(basename "$f" .mp3)
            sox "$f" -r 16000 -c 1 -b 16 \
              $GITHUB_WORKSPACE/.oww_wav/${WORD_LOWER}/${base}.wav 2>/dev/null \
              && count=$((count+1))
          done
          echo "Converted: ${count} WAV files"

      - name: Train classifier and export ONNX
        run: |
          WORD="${{ github.event.inputs.word || inputs.word }}"
          WORD_LOWER=$(echo "$WORD" | tr '[:upper:]' '[:lower:]')

          python3 << PYTHON
import os, sys, glob
import numpy as np
import torch
import torch.nn as nn
from torch.utils.data import DataLoader, TensorDataset
import onnxruntime as ort
import soundfile as sf

WORD       = "${WORD}"
WORD_LOWER = "${WORD_LOWER}"
WAV_DIR    = "$GITHUB_WORKSPACE/.oww_wav/${WORD_LOWER}"
NEG_FILE   = "$GITHUB_WORKSPACE/.oww_cache/negative_features.npy"
MEL_MODEL  = "$GITHUB_WORKSPACE/.oww_backbone/melspectrogram.onnx"
EMB_MODEL  = "$GITHUB_WORKSPACE/.oww_backbone/embedding_model.onnx"
OUT_DIR    = "models"
os.makedirs(OUT_DIR, exist_ok=True)

print("Loading backbone models...")
mel_sess = ort.InferenceSession(MEL_MODEL)
emb_sess = ort.InferenceSession(EMB_MODEL)
mel_in   = mel_sess.get_inputs()[0].name
emb_in   = emb_sess.get_inputs()[0].name
mel_out  = mel_sess.get_outputs()[0].name
emb_out  = emb_sess.get_outputs()[0].name

def embed(chunk):
    a = chunk.astype(np.float32) / 32768.0
    a = a.reshape(1, 1, -1)
    mel = mel_sess.run([mel_out], {mel_in: a})[0]
    return emb_sess.run([emb_out], {emb_in: mel})[0].flatten()

print("Extracting positive features...")
pos = []
CHUNK, STRIDE = 1280, 640
for i, f in enumerate(sorted(glob.glob(f"{WAV_DIR}/*.wav"))):
    try:
        audio, sr = sf.read(f, dtype='int16')
        if sr != 16000: continue
        if len(audio) < CHUNK:
            audio = np.pad(audio, (0, CHUNK - len(audio)))
        for s in range(0, len(audio) - CHUNK + 1, STRIDE):
            pos.append(embed(audio[s:s+CHUNK]))
    except: pass
    if (i+1) % 100 == 0:
        print(f"  {i+1} files, {len(pos)} features")

pos = np.array(pos, dtype=np.float32)
print(f"  {len(pos)} positive features")
if len(pos) < 50:
    print("ERROR: not enough features", file=sys.stderr)
    sys.exit(1)

print("Loading negative features...")
neg_all = np.load(NEG_FILE, mmap_mode='r')
n_neg = min(len(neg_all), len(pos) * 15)
neg = neg_all[np.random.choice(len(neg_all), n_neg, replace=False)].astype(np.float32)
print(f"  {n_neg} negative samples")

X = np.vstack([pos, neg])
y = np.array([1.0]*len(pos) + [0.0]*n_neg, dtype=np.float32)
p = np.random.permutation(len(X))
X, y = X[p], y[p]
feat_dim = X.shape[1]
print(f"  Dataset: {len(X)} samples, dim: {feat_dim}")

dl = DataLoader(TensorDataset(torch.from_numpy(X), torch.from_numpy(y).unsqueeze(1)),
                batch_size=512, shuffle=True)

model = nn.Sequential(
    nn.Linear(feat_dim, 128), nn.ReLU(), nn.Dropout(0.2),
    nn.Linear(128, 64),       nn.ReLU(), nn.Dropout(0.1),
    nn.Linear(64, 1),         nn.Sigmoid()
)
opt    = torch.optim.Adam(model.parameters(), lr=1e-3, weight_decay=1e-4)
sched  = torch.optim.lr_scheduler.ReduceLROnPlateau(opt, patience=10)
loss_fn = nn.BCELoss()

print("Training (150 epochs)...")
for epoch in range(150):
    model.train()
    total = 0
    for xb, yb in dl:
        opt.zero_grad()
        loss = loss_fn(model(xb), yb)
        loss.backward()
        opt.step()
        total += loss.item()
    avg = total / len(dl)
    sched.step(avg)
    if (epoch+1) % 30 == 0:
        print(f"  Epoch {epoch+1}/150 — loss: {avg:.4f}")

print("Exporting ONNX...")
model.eval()
path = f"{OUT_DIR}/{WORD_LOWER}.onnx"
torch.onnx.export(
    model, torch.zeros(1, feat_dim), path,
    input_names=["embedding"], output_names=["score"],
    dynamic_axes={"embedding": {0: "batch"}, "score": {0: "batch"}},
    opset_version=11
)
size = os.path.getsize(path) / 1024
print(f"  Saved: {path} ({size:.1f} KB)")

sess = ort.InferenceSession(path)
score = sess.run(None, {"embedding": np.zeros((1, feat_dim), dtype=np.float32)})[0][0][0]
print(f"  Verified — zero-input score: {score:.4f}")
print(f"Training complete for '{WORD}'")
PYTHON

      - name: Commit model
        run: |
          WORD="${{ github.event.inputs.word || inputs.word }}"
          WORD_LOWER=$(echo "$WORD" | tr '[:upper:]' '[:lower:]')
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "models/${WORD_LOWER}.onnx"
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add wake word model '${WORD}' [skip ci]"
            git push
            echo "Committed: models/${WORD_LOWER}.onnx"
            echo "Live at: https://www.hestari.com/models/${WORD_LOWER}.onnx"
          fi

      - name: Summary
        if: always()
        run: |
          WORD="${{ github.event.inputs.word || inputs.word }}"
          WORD_LOWER=$(echo "$WORD" | tr '[:upper:]' '[:lower:]')
          echo "=============================="
          echo "  Word:  ${WORD}"
          [ -f "models/${WORD_LOWER}.onnx" ] && \
            echo "  Model: $(du -h models/${WORD_LOWER}.onnx | cut -f1)" || \
            echo "  Model: not produced"
          echo "=============================="
