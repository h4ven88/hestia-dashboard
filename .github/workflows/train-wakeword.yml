name: Train Wake Word

on:
  workflow_dispatch:
    inputs:
      word:
        description: 'Wake word to train (e.g. Athena, Hestia, Jarvis)'
        required: true
        default: 'Athena'
      clips:
        description: 'Number of synthetic clips to generate'
        required: false
        default: '500'
  workflow_call:
    inputs:
      word:
        required: true
        type: string
      clips:
        required: false
        type: string
        default: '500'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1 sox espeak-ng libsox-fmt-mp3 libmad0

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install edge-tts==6.1.12 numpy==1.26.4 scipy==1.13.0 \
                      soundfile==0.12.1 pydub==0.25.1 \
                      onnx==1.16.0 onnxruntime==1.18.0
          pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Download OpenWakeWord backbone models
        run: |
          mkdir -p $GITHUB_WORKSPACE/.backbone
          wget -q -O $GITHUB_WORKSPACE/.backbone/melspectrogram.onnx \
            "https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/melspectrogram.onnx"
          wget -q -O $GITHUB_WORKSPACE/.backbone/embedding_model.onnx \
            "https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/embedding_model.onnx"
          ls -lh $GITHUB_WORKSPACE/.backbone/

      - name: Generate synthetic clips (positive + negative)
        run: |
          WORD="${{ github.event.inputs.word || inputs.word }}"
          CLIPS="${{ github.event.inputs.clips || inputs.clips || '500' }}"
          WORD_LOWER=$(echo "$WORD" | tr '[:upper:]' '[:lower:]')
          POS_DIR="$GITHUB_WORKSPACE/.clips/${WORD_LOWER}/pos"
          NEG_DIR="$GITHUB_WORKSPACE/.clips/${WORD_LOWER}/neg"
          mkdir -p "$POS_DIR" "$NEG_DIR"
          python3 scripts/generate_clips.py "$WORD" "$CLIPS" "$POS_DIR" "$NEG_DIR"
          echo "Positive clips: $(ls $POS_DIR | wc -l)"
          echo "Negative clips: $(ls $NEG_DIR | wc -l)"

      - name: Convert clips to 16kHz WAV
        run: |
          WORD="${{ github.event.inputs.word || inputs.word }}"
          WORD_LOWER=$(echo "$WORD" | tr '[:upper:]' '[:lower:]')

          convert_dir() {
            local IN_DIR="$1"
            local OUT_DIR="$2"
            mkdir -p "$OUT_DIR"
            count=0
            for f in "$IN_DIR"/*.mp3 "$IN_DIR"/*.wav; do
              [ -f "$f" ] || continue
              base=$(basename "${f%.*}")
              if sox "$f" -r 16000 -c 1 -b 16 "$OUT_DIR/${base}.wav" 2>/dev/null; then
                count=$((count+1))
              fi
            done
            echo "$count"
          }

          POS_IN="$GITHUB_WORKSPACE/.clips/${WORD_LOWER}/pos"
          NEG_IN="$GITHUB_WORKSPACE/.clips/${WORD_LOWER}/neg"
          POS_WAV="$GITHUB_WORKSPACE/.wav/${WORD_LOWER}/pos"
          NEG_WAV="$GITHUB_WORKSPACE/.wav/${WORD_LOWER}/neg"

          pos_count=$(convert_dir "$POS_IN" "$POS_WAV")
          neg_count=$(convert_dir "$NEG_IN" "$NEG_WAV")
          echo "Converted: ${pos_count} positive, ${neg_count} negative WAV files"

          if [ "$pos_count" -eq 0 ] || [ "$neg_count" -eq 0 ]; then
            echo "ERROR: Missing converted clips"
            exit 1
          fi

      - name: Train classifier and export ONNX
        run: |
          WORD="${{ github.event.inputs.word || inputs.word }}"
          WORD_LOWER=$(echo "$WORD" | tr '[:upper:]' '[:lower:]')
          python3 scripts/train_classifier.py \
            "$WORD" \
            "$GITHUB_WORKSPACE/.wav/${WORD_LOWER}/pos" \
            "$GITHUB_WORKSPACE/.wav/${WORD_LOWER}/neg" \
            "$GITHUB_WORKSPACE/.backbone/melspectrogram.onnx" \
            "$GITHUB_WORKSPACE/.backbone/embedding_model.onnx" \
            "models"

      - name: Commit model to repository
        run: |
          WORD="${{ github.event.inputs.word || inputs.word }}"
          WORD_LOWER=$(echo "$WORD" | tr '[:upper:]' '[:lower:]')
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Copy backbone models to models/ so hestari.com serves them (fixes CORS)
          cp $GITHUB_WORKSPACE/.backbone/melspectrogram.onnx models/melspectrogram.onnx
          cp $GITHUB_WORKSPACE/.backbone/embedding_model.onnx models/embedding_model.onnx
          git add "models/${WORD_LOWER}.onnx" models/melspectrogram.onnx models/embedding_model.onnx
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add wake word model '${WORD}' + backbone models [skip ci]"
            git push
            echo "Live at: https://www.hestari.com/models/${WORD_LOWER}.onnx"
          fi

      - name: Summary
        if: always()
        run: |
          WORD="${{ github.event.inputs.word || inputs.word }}"
          WORD_LOWER=$(echo "$WORD" | tr '[:upper:]' '[:lower:]')
          echo "=============================="
          echo "  Word:  ${WORD}"
          if [ -f "models/${WORD_LOWER}.onnx" ]; then
            echo "  Size:  $(du -h models/${WORD_LOWER}.onnx | cut -f1)"
            echo "  URL:   https://www.hestari.com/models/${WORD_LOWER}.onnx"
          else
            echo "  Model: not produced"
          fi
          echo "=============================="
