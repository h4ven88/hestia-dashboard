name: Train Wake Word Model

on:
  workflow_dispatch:
    inputs:
      word:
        description: 'Wake word to train (e.g., athena, hestia, jarvis)'
        required: true
        default: 'athena'
      positive_count:
        description: 'Base positive clips (each generates ~18 augmented variants)'
        required: false
        default: '200'
      negative_count:
        description: 'Base negative clips (each generates ~5 variants)'
        required: false
        default: '300'
      epochs:
        description: 'Training epochs'
        required: false
        default: '500'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y espeak-ng ffmpeg

    - name: Install Python dependencies
      run: |
        pip install edge-tts onnxruntime numpy onnx

    - name: Download backbone models (if not present)
      run: |
        mkdir -p models
        if [ ! -f models/melspectrogram.onnx ]; then
          echo "Downloading melspectrogram.onnx..."
          curl -L -o models/melspectrogram.onnx \
            "https://github.com/dscripka/openWakeWord/raw/main/openwakeword/resources/models/melspectrogram.onnx"
        fi
        if [ ! -f models/embedding_model.onnx ]; then
          echo "Downloading embedding_model.onnx..."
          curl -L -o models/embedding_model.onnx \
            "https://github.com/dscripka/openWakeWord/raw/main/openwakeword/resources/models/embedding_model.onnx"
        fi
        ls -la models/

    - name: Generate training clips
      run: |
        python scripts/generate_clips.py \
          --word "${{ github.event.inputs.word }}" \
          --output-dir clips \
          --positive-count ${{ github.event.inputs.positive_count }} \
          --negative-count ${{ github.event.inputs.negative_count }}

    - name: Train classifier
      run: |
        python scripts/train_classifier.py \
          --word "${{ github.event.inputs.word }}" \
          --clips-dir clips \
          --models-dir models \
          --epochs ${{ github.event.inputs.epochs }}

    - name: Upload trained model as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.word }}-model
        path: models/${{ github.event.inputs.word }}.onnx
        retention-days: 90

    - name: Commit model to repo (if athena)
      if: github.event.inputs.word == 'athena'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add models/${{ github.event.inputs.word }}.onnx
        git diff --cached --quiet || git commit -m "chore: retrain ${{ github.event.inputs.word }}.onnx with augmented data"
        git push
