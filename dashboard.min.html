}

const ct2 = safeNum(attrs.colorTemperature); if (ct2 !== null) S[id].ct = ct2;

const heat = safeNum(attrs.heatingSetpoint);
const cool = safeNum(attrs.coolingSetpoint);
const hum  = safeNum(attrs.humidity);

if (heat !== null) S[id].heat     = heat;
if (cool !== null) S[id].cool     = cool;
if (hum  !== null) S[id].humidity = hum;
if (attrs.thermostatMode != null) S[id].mode = attrs.thermostatMode;
if (attrs.thermostatOperatingState != null) {

}
function hsvToRGB(h, s) {
const l = 50, c = (1 - Math.abs(2 * l / 100 - 1)) * s / 100;
const x = c * (1 - Math.abs((h / 60) % 2 - 1));
const m = l / 100 - c / 2;
let r = 0, g = 0, b = 0;
if (h < 60)       { r = c; g = x; }
else if (h < 120) { r = x; g = c; }
else if (h < 180) { g = c; b = x; }
else if (h < 240) { g = x; b = c; }
else if (h < 300) { r = x; b = c; }
else              { r = c; b = x; }
return `rgb(${Math.round((r+m)*255)},${Math.round((g+m)*255)},${Math.round((b+m)*255)})`;

async function spDevAssignRoom(devId, devType, roomId) {
if (!roomId) {
rooms.forEach(r => {
['switches','dimmers','fans','shades'].forEach(t => {
const idx = r[t].findIndex(d => String(d.id) === String(devId));
if (idx > -1) r[t].splice(idx, 1);
});
});
const alreadyStaging = staging.some(d => String(d.id) === String(devId));
if (!alreadyStaging) staging.push({ id: devId, name: spGetDeviceName(devId), type: devType, visible: true });
} else {
const room = rooms.find(r => r.id === roomId);
if (!room) return;
const devName = spGetDeviceName(devId);
rooms.forEach(r => {
['switches','dimmers','fans','shades'].forEach(t => {
const idx = r[t].findIndex(d => String(d.id) === String(devId));
if (idx > -1) r[t].splice(idx, 1);
});
});
const si = staging.findIndex(d => String(d.id) === String(devId));
if (si > -1) staging.splice(si, 1);
const entry = { id: devId, name: devName };
const typeKey = { switch:'switches', dimmer:'dimmers', fan:'fans', shade:'shades', color:'colors', 'color-temp':'colortemps' }[devType];
if (typeKey) room[typeKey].push(entry);
}
deduplicateStaging();
await saveConfig();
initState(); snapshotState(); updateStats();
spRefreshDevices();
updateGearBadge();
}

const name = inp ? inp.value.trim() : '';
if (!name) { if (inp) inp.focus(); return; }
const id = name.toLowerCase().replace(/[^a-z0-9]/g,'_').replace(/_+/g,'_') + '_' + Date.now().toString(36);
rooms.push({ id, name, short: name.split(' ')[0], switches:[], dimmers:[], fans:[], shades:[], colors:[], colortemps:[], therms:[], placeholders:[] });
await spDevAssignRoom(devId, devType, id);
applyConfig();
}
function spGetDeviceName(devId) {
for (const r of rooms) {
for (const t of ['switches','dimmers','fans','shades']) {
const d = r[t].find(d => String(d.id) === String(devId));
if (d) return d.name;
}
}
const sd = staging.find(d => String(d.id) === String(devId));
if (sd) return sd.name;
const pd = (lastPollDevices || []).find(d => String(d.id) === String(devId));
return pd ? (pd.label || pd.name || devId) : devId;
}
async function spDevRetype(devId, currentRoomId, newType) {
const typeArrayMap = { switch:'switches', dimmer:'dimmers', fan:'fans', shade:'shades', color:'colors', 'color-temp':'colortemps' };
rooms.forEach(r => {
Object.values(typeArrayMap).forEach(arr => {
if (!r[arr]) return;
const idx = r[arr].findIndex(d => String(d.id) === String(devId));
if (idx > -1) r[arr].splice(idx, 1);
});
});
const si = staging.findIndex(d => String(d.id) === String(devId));
if (si > -1) staging[si].type = newType;
if (currentRoomId && currentRoomId !== '__therm__') {
const room = rooms.find(r => r.id === currentRoomId);
if (room) {
const arr = typeArrayMap[newType];
if (arr) {
if (!room[arr]) room[arr] = [];
room[arr].push({ id: devId, name: spGetDeviceName(devId) });
}
}
}
DEVICE_TYPE[devId] = newType;
const initMap = {
switch:       { on: false },
dimmer:       { on: false, val: 0 },
fan:          { spd: 'off' },
shade:        { pct: 0 },
color:        { on: false, val: 0, hue: 0, sat: 100, ct: 2700, mode: 'CT' },
'color-temp': { on: false, val: 0, ct: 2700 }
};
S[devId] = Object.assign({}, initMap[newType] || { on: false });
await saveConfig();
initState(); snapshotState(); updateStats();
spRefreshDevices();
}
async function spDevRemove(devId) {

rooms.forEach(r => {

const idx = r[t].findIndex(d => String(d.id) === String(devId));
if (idx > -1) r[t].splice(idx, 1);
});
});
const si = staging.findIndex(d => String(d.id) === String(devId));
if (si > -1) staging.splice(si, 1);
DEVICE_REGISTRY.delete(String(devId));
delete S[devId]; delete DEVICE_TYPE[devId]; delete PREV_S[devId];
await saveConfig();
updateStats(); spRefreshDevices(); updateGearBadge();
}

async function spAssignFromStaging(si) {

async function spLookupZip() {
const zipEl    = document.getElementById('sp-zip');
const statusEl = document.getElementById('sp-zip-status');
const zip = zipEl ? zipEl.value.trim() : '';
if (!zip || !/^\d{5}$/.test(zip)) {
if (statusEl) { statusEl.textContent = 'Enter a valid 5-digit ZIP'; statusEl.style.color = 'var(--conn-err)'; }
return;
}
if (statusEl) { statusEl.textContent = 'Looking up\u2026'; statusEl.style.color = 'var(--t3)'; }
try {
const res = await fetch(`https://api.zippopotam.us/us/${zip}`);
if (!res.ok) throw new Error('ZIP not found');
const data  = await res.json();
const place = data.places && data.places[0];
if (!place) throw new Error('No location data');
const lat  = parseFloat(place.latitude).toFixed(4);
const lon  = parseFloat(place.longitude).toFixed(4);
const city = place['place name'] + ', ' + place['state abbreviation'];
const latEl = document.getElementById('sp-lat');
const lonEl = document.getElementById('sp-lon');
if (latEl) latEl.value = lat;
if (lonEl) lonEl.value = lon;
CONFIG.weather.zip  = zip;
CONFIG.weather.city = city;
if (statusEl) { statusEl.textContent = '\u2713 ' + city + ' \u2014 ' + lat + ', ' + lon; statusEl.style.color = 'var(--t2)'; }
} catch(e) {
if (statusEl) { statusEl.textContent = 'ZIP not found \u2014 check the code or enter coordinates manually'; statusEl.style.color = 'var(--conn-err)'; }
}
}

if (wrap) wrap.remove();
document.querySelector('.panel').style.display = '';
loadTheme(); syncTopbar(); bootstrapWeather();
if (!isMobile()) { document.addEventListener('pointerdown', resetInactivityTimer); resetInactivityTimer(); }
scheduleNextPoll();
return;
}
}
}
obUpdateNext();
} catch(e) {
OB.testOk = false;
res.textContent = '\u2717 ' + (e.message.includes('fetch') ? 'Could not reach hub \u2014 check URL and network' : e.message);
res.className = 'ob-test-result err';
obUpdateNext();
}
}
function obStep2() {
if (!OB.inventory.length) {
OB.inventory = OB.devices.map(d => ({
id:     String(d.id),
name:   d.label || d.name || ('Device ' + d.id),
type:   capToType(d.capabilities),
assign: 'staging',   
keep:   true         
}));
OB.thermostats = OB.inventory
.filter(d => d.type === 'therm')
.map(d => ({ id: d.id, name: d.name, zone: '', selected: true }));
const firstLock = OB.inventory.find(d => d.type === 'lock');
if (firstLock) OB.lock = { id: firstLock.id, label: firstLock.name };
}
const byType = {};
OB_TYPE_ORDER.forEach(t => { byType[t] = OB.inventory.filter(d => d.type === t); });
const sections = OB_TYPE_ORDER
.filter(t => byType[t].length > 0)
.map(t => {
const rows = byType[t].map((d, li) => {
const gi = OB.inventory.indexOf(d);
return `
<div class="ob-device-row">
<input type="checkbox" ${d.keep ? 'checked' : ''} style="accent-color:var(--amber);flex-shrink:0"
onchange="OB.inventory[${gi}].keep=this.checked">
<span class="ob-device-type" style="width:64px">${OB_TYPE_LABELS[t]}</span>
<span class="ob-device-name">${d.name}</span>
<span class="ob-device-id">#${d.id}</span>
</div>`;
}).join('');
const count = byType[t].length;
return `
<div style="margin-bottom:14px">
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
<span style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)">${OB_TYPE_LABELS[t]}s</span>
<span style="font-size:10px;color:var(--t3)">${count} device${count!==1?'s':''}</span>
</div>
<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:2px 12px">
${rows}
</div>
</div>`;
}).join('');
const total = OB.inventory.length;
return `
<div class="ob-step-lbl">Step 2 of 4 — Device Inventory</div>
<div class="ob-title">Your devices</div>
<div class="ob-sub">${total} device${total!==1?'s':''} found. Uncheck any you don\u2019t want in the dashboard. Everything else will be assigned to rooms in the next step.</div>
<div style="max-height:360px;overflow-y:auto;padding-right:2px">
${sections || '<div style="color:var(--t3);font-size:13px;padding:12px 0">No controllable devices found.</div>'}
</div>`;
}
function obStep3() {
const roomRows = OB.roomList.map((r, ri) => `
<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
<input class="ob-input" style="flex:1" value="${r.name}"
onchange="OB.roomList[${ri}].name=this.value;OB.roomList[${ri}].short=this.value.split(' ')[0];OB.roomList[${ri}].id=this.value.toLowerCase().replace(/[^a-z0-9]/g,'_').replace(/_+/g,'_')">
<button class="ob-device-remove" onclick="OB.roomList.splice(${ri},1);document.getElementById('ob-body').innerHTML=obStep3()">✕</button>
</div>`).join('');
return `
<div class="ob-step-lbl">Step 3 of 4 — Rooms</div>
<div class="ob-title">Create your rooms</div>
<div class="ob-sub">Add a room for each area of your home. You can rename, add, or remove rooms any time in Settings. Skip this step and all devices will go to Staging until you\u2019re ready.</div>
<div id="ob-room-list" style="margin-bottom:12px;max-height:240px;overflow-y:auto">
${roomRows || '<div style="font-size:12px;color:var(--t4);padding:8px 0 12px">No rooms yet \u2014 add one below.</div>'}
</div>
<div style="display:flex;gap:8px">
<input class="ob-input" id="ob-new-room" placeholder="Room name (e.g. Master Bedroom)"
onkeydown="if(event.key==='Enter')obAddRoom()"
style="flex:1">
<button class="ob-test-btn" onclick="obAddRoom()">+ Add</button>
</div>
<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border-s)">
<div style="font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);margin-bottom:8px">Thermostats to display</div>
${OB.thermostats.map((t,i) => `
<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-s)">
<input type="checkbox" id="ob-th-${i}" ${t.selected!==false?'checked':''} style="accent-color:var(--amber)"
onchange="OB.thermostats[${i}].selected=this.checked">
<label for="ob-th-${i}" style="flex:1;font-size:13px;color:var(--t2);cursor:pointer">${t.name}</label>
<span style="font-size:11px;color:var(--t4)">#${t.id}</span>
</div>`).join('') || '<div style="font-size:12px;color:var(--t4)">No thermostats found.</div>'}
</div>`;
}
function obAddRoom() {
const input = document.getElementById('ob-new-room');
const name  = input ? input.value.trim() : '';
if (!name) return;
const id = name.toLowerCase().replace(/[^a-z0-9]/g,'_').replace(/_+/g,'_') + '_' + Date.now().toString(36);
OB.roomList.push({ id, name, short: name.split(' ')[0] });
document.getElementById('ob-body').innerHTML = obStep3();
}
function obStep4() {
const kept = OB.inventory.filter(d => d.keep && d.type !== 'therm' && d.type !== 'lock');
if (!kept.length) {
return `
<div class="ob-step-lbl">Step 4 of 4 — Assign Devices</div>
<div class="ob-title">All done!</div>
<div class="ob-sub">No controllable devices to assign. Click Launch to open your dashboard.</div>`;
}
const roomOpts = OB.roomList.map(r =>
`<option value="${r.id}">${r.name}</option>`).join('');
const rows = kept.map((d, ki) => {
const gi = OB.inventory.indexOf(d);
return `
<div class="ob-device-row" style="padding:9px 0">
<span class="ob-device-type" style="width:60px">${OB_TYPE_LABELS[d.type]||d.type}</span>
<span class="ob-device-name" style="flex:1">${d.name}</span>
<select class="ob-pref-select" style="font-size:11px;padding:4px 8px"
onchange="OB.inventory[${gi}].assign=this.value">
<option value="staging" ${d.assign==='staging'?'selected':''}>Staging</option>
${OB.roomList.map(r =>
`<option value="${r.id}" ${d.assign===r.id?'selected':''}>${r.name}</option>`
).join('')}
</select>
</div>`;
}).join('');
const lockDev = OB.inventory.find(d => d.type === 'lock' && d.keep);
const lockRow = lockDev ? `
<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border-s)">
<div style="font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);margin-bottom:8px">Door Lock (topbar)</div>
<div class="ob-device-row" style="padding:6px 0">
<span class="ob-device-name" style="flex:1">${lockDev.name}</span>
<input class="ob-input" style="width:160px;font-size:12px;padding:5px 10px" placeholder="Display label"
value="${OB.lock.label||lockDev.name}"
onchange="OB.lock.label=this.value">
</div>
</div>` : '';
const stagingCount = kept.filter(d => d.assign === 'staging').length;
const assignedCount = kept.length - stagingCount;
return `
<div class="ob-step-lbl">Step 4 of 4 — Assign Devices</div>
<div class="ob-title">Where does each device live?</div>
<div class="ob-sub">Assign devices to rooms. Anything left in Staging can be assigned later from Settings \u2014 it won\u2019t appear in the dashboard until you do.</div>
<div style="max-height:320px;overflow-y:auto;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:2px 12px;margin-bottom:4px">
${rows}
</div>
<div style="font-size:11px;color:var(--t3);text-align:right;margin-bottom:4px">
${assignedCount} assigned &nbsp;·&nbsp; ${stagingCount} in Staging
</div>
${lockRow}
<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border-s)">
<div style="display:flex;align-items:center;justify-content:space-between">
<div>
<div class="ob-pref-lbl">Weather location</div>
<div class="ob-pref-sub">US National Weather Service</div>
${OB.weather.lat && OB.weather.lon ? `<div class="ob-coords">\u2713 ${parseFloat(OB.weather.lat).toFixed(2)}, ${parseFloat(OB.weather.lon).toFixed(2)}</div>` : ''}
</div>
<button class="ob-geo-btn" onclick="obGeolocate()">${OB.weather.lat?'Update':'Use my location'}</button>
</div>
</div>`;
}
function obGeolocate() {
if (!navigator.geolocation) { alert('Geolocation not available.'); return; }
navigator.geolocation.getCurrentPosition(pos => {
OB.weather.lat = pos.coords.latitude.toFixed(4);
OB.weather.lon = pos.coords.longitude.toFixed(4);
document.getElementById('ob-body').innerHTML = obStep4();
}, () => { alert('Location unavailable. Set coordinates in Settings after setup.'); });
}
function obBack() {
if (OB.step > 1) { OB.step--; renderOnboarding(); }
}
async function obNext() {
if (OB.step === 1) {
if (!OB.testOk) { obTestConnection(); return; }
OB.step = 2; renderOnboarding();
} else if (OB.step === 2) {
OB.step = 3; renderOnboarding();
} else if (OB.step === 3) {
OB.step = 4; renderOnboarding();
} else {
obFinish();
}
}
function obFinish() {
CONFIG.hub    = OB.hub;
CONFIG.appId  = OB.appId;
CONFIG.token  = OB.token;
CONFIG.weather.lat = parseFloat(OB.weather.lat) || 36.52;
CONFIG.weather.lon = parseFloat(OB.weather.lon) || -82.56;
if (OB.lock.id) CONFIG.lock = { id: OB.lock.id, label: OB.lock.label || 'Front Door' };
rooms.length = 0;
OB.roomList.forEach(r => {
const rDevices = OB.inventory.filter(d => d.keep && d.assign === r.id);
rooms.push({
id: r.id, name: r.name, short: r.short,
switches:   rDevices.filter(d => d.type==='switch').map(d=>({id:d.id,name:d.name})),
dimmers:    rDevices.filter(d => d.type==='dimmer').map(d=>({id:d.id,name:d.name})),
fans:       rDevices.filter(d => d.type==='fan').map(d=>({id:d.id,name:d.name})),
shades:     rDevices.filter(d => d.type==='shade').map(d=>({id:d.id,name:d.name})),
colors:     rDevices.filter(d => d.type==='color').map(d=>({id:d.id,name:d.name})),
colortemps: rDevices.filter(d => d.type==='color-temp').map(d=>({id:d.id,name:d.name})),
therms:     [], placeholders: []
});
});
thermostats.length = 0;
OB.thermostats.filter(t => t.selected !== false).forEach(t => {
thermostats.push({ id: t.id, name: t.name, zone: '' });
});
staging.length = 0;
OB.inventory
.filter(d => d.keep && d.assign === 'staging' && d.type !== 'therm' && d.type !== 'lock')
.forEach(d => staging.push({ id: d.id, name: d.name, type: d.type }));
saveConfig(); 
applyConfig();
const wrap = document.getElementById('ob-wrap');
if (wrap) wrap.remove();
document.querySelector('.panel').style.display = '';
loadTheme();
syncTopbar();
bootstrapWeather();
if (!isMobile()) {
document.addEventListener('pointerdown', resetInactivityTimer);
resetInactivityTimer();
}
scheduleNextPoll();
}
function launchOnboarding() {
OB = {
step: 1, hub: CONFIG.hub, appId: CONFIG.appId, token: CONFIG.token,
devices: [], inventory: [], roomList: [], thermostats: [],
lock: { id: CONFIG.lock&&CONFIG.lock.id||'', label: CONFIG.lock&&CONFIG.lock.label||'' },
weather: { lat: CONFIG.weather.lat||'', lon: CONFIG.weather.lon||'' },
testOk: false
};
closeSettings();
renderOnboarding();
}
(async function init() {
loadTheme();
loadDisplayMode();
await discoverHubStore();
if (needsOnboarding()) {
if (HUB_STORE) {
const hubCfg = await loadConfigFromHub();
if (hubCfg) {
applyParsedConfig(hubCfg);
try { localStorage.setItem('dashboard-config', JSON.stringify(hubCfg)); } catch(e) {}
} else {
renderOnboarding();
return;
}
} else {
renderOnboarding();
return;
}
} else {
if (HUB_STORE) {
const hubCfg = await loadConfigFromHub();
if (hubCfg) {
applyParsedConfig(hubCfg);
try { localStorage.setItem('dashboard-config', JSON.stringify(hubCfg)); } catch(e) {}
}
}
}
try {
await fetchAllDevices();
lastConnOk = true;
} catch (e) {
lastConnOk = false;
setConn('err');
}
refreshActiveView();
updateStats();
syncTopbar();
bootstrapWeather();
if (!isMobile()) {
document.addEventListener('pointerdown', resetInactivityTimer);
resetInactivityTimer();
}
scheduleNextPoll();
})();</script>
</body>
