[versions]
agp = "9.4.1"
coreKtx = "1.15.0"
appcompat = "1.7.0"
webkit = "1.12.1"
okhttp = "4.12.0"
coroutines = "1.9.0"
junit = "4.13.2"
# Pinned via the BOM rather than per-library, so firebase-messaging and
# anything added later cannot drift into an untested combination.
firebaseBom = "33.7.0"
googleServices = "4.4.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
# WebViewAssetLoader and addDocumentStartJavaScript both live here. Without it
# the page would have to load from file://, which is not a secure context --
# and the dashboard's entire household-key system is built on crypto.subtle.
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
# The hub's certificate is self-signed AND carries no subjectAltName, so no
# stock client can ever validate it: hostname verification has no SAN to check
# and CN fallback was removed from modern TLS stacks. Pinning the public key is
# the only route, and it needs a custom trust manager either way -- OkHttp just
# makes the rest of the client sane.
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Push to a closed app. An Android WebView has no Push API and no service
# worker push, so the dashboard's Web Push path cannot work here at all and
# FCM is the only transport to a device that is not on screen.
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
# AGP 9 carries Kotlin support itself; adding org.jetbrains.kotlin.android
# alongside it is now a hard error, not a warning.
android-application = { id = "com.android.application", version.ref = "agp" }
# Reads android/app/google-services.json at build time and generates the
# Firebase config resources. That file is gitignored, so a checkout without it
# fails here rather than silently building an app whose push can never work.
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
