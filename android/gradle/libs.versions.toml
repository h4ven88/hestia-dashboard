[versions]
agp = "9.4.1"
coreKtx = "1.15.0"
appcompat = "1.7.0"
webkit = "1.12.1"
okhttp = "4.12.0"
coroutines = "1.9.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
# WebViewAssetLoader and addDocumentStartJavaScript both live here. Without it
# the page would have to load from file://, which is not a secure context --
# and the dashboard's entire household-key system is built on crypto.subtle.
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
# The hub's certificate is self-signed AND carries no subjectAltName, so no
# stock client can ever validate it: hostname verification has no SAN to check
# and CN fallback was removed from modern TLS stacks. Pinning the public key is
# the only route, and it needs a custom trust manager either way -- OkHttp just
# makes the rest of the client sane.
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
# AGP 9 carries Kotlin support itself; adding org.jetbrains.kotlin.android
# alongside it is now a hard error, not a warning.
android-application = { id = "com.android.application", version.ref = "agp" }
